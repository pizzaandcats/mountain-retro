<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the list | Mountain Retro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2a44">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preload" href="../assets/fonts/jost-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/site.css">
<script>
  /* ---------------------------------------------------------------
     POLL STORAGE
     Paste the URL of the endpoint that saves votes (for example the
     Google Apps Script web app described in README.md). Until this is
     set, the page says plainly that votes are NOT being saved.
     --------------------------------------------------------------- */
  window.MR_POLL_ENDPOINT = "https://script.google.com/macros/s/AKfycbyuEu_ULR9PY1YsqTiw3uSt2c7VTjY5VEg5aHToPqflirYzflvzITsJSUspZycbG3fU/exec";
</script>
<style>
.setup-note { display: none; background: var(--sock-red); color: #fff; }
.setup-note.show { display: block; }
.setup-note .wrap { padding-top: 10px; padding-bottom: 10px; font-size: 14px; }
.setup-note code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }

.poll-page { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: var(--navy); }
.poll-page .masthead { background: var(--cream); }
.poll-page main { flex: 1; display: flex; }
.poll { background: var(--navy); color: var(--cream); flex: 1; display: flex; align-items: center; }
.poll .wrap { width: 100%; }
.poll .wrap { padding-top: clamp(32px, 4vw, 56px); padding-bottom: clamp(40px, 5vw, 72px); }
.poll-head { margin-bottom: 28px; }
.poll-head .kicker { color: var(--gold-on-navy); margin: 0 0 12px; font-size: clamp(17px, 1.5vw, 20px); font-weight: 500; line-height: 1.4; }
.poll h1 { margin: 0; font-size: clamp(36px, 4.4vw, 60px); line-height: .95; font-weight: 700; letter-spacing: -.02em; }

.ballot { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.ballot legend { position: absolute; left: -9999px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; top: 24px; left: 24px; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.opt label {
  display: grid; grid-template-rows: 1fr auto; gap: 18px; height: 100%;
  min-height: 150px; padding: 18px 18px 16px;
  border: 2px solid var(--cream); cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.opt .name { font-size: 22px; font-weight: 700; line-height: 1.05; }
.opt .desc { font-size: 15px; line-height: 1.45; display: block; margin-top: 8px; font-weight: 400; }
.opt .box { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; }
.opt .box::before { content: ""; width: 20px; height: 20px; border: 2px solid currentColor; flex: none; }
.opt label:hover { background: rgba(243, 234, 216, .08); }
.opt input:focus-visible + label { outline: 3px solid var(--gold-on-navy); outline-offset: 3px; }
.opt input:checked + label { background: var(--cream); color: var(--navy); }
.opt input:checked + label .box::before { background: var(--navy); box-shadow: inset 0 0 0 3px var(--cream); }
.opt input:disabled + label { cursor: default; }

.poll-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px; margin-top: 28px; }
.poll .btn { background: var(--orange-on-navy); color: var(--navy); border-color: var(--orange-on-navy); box-shadow: 6px 6px 0 var(--gold-on-navy); }
.poll .btn:hover { box-shadow: 4px 4px 0 var(--gold-on-navy); }
.poll .btn[disabled] { opacity: .55; cursor: not-allowed; transform: none; }
.status { margin: 0; font-size: 16px; min-height: 1.5em; flex-basis: 100%; }
.status.ok { color: var(--gold-on-navy); font-weight: 700; }
.status.warn { color: var(--cream); background: var(--sock-red); padding: 8px 12px; font-weight: 500; }

@media (max-width: 1100px) {
  .ballot { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .ballot { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .opt label { min-height: 0; gap: 10px; padding: 12px 14px; }
}
@media (max-width: 560px) {
  .poll-page .masthead .wrap { padding-top: 12px; padding-bottom: 12px; }
  .poll-page .masthead .logo img { width: 150px; }
  .poll .wrap { padding-top: 20px; padding-bottom: 24px; }
  .poll-head { margin-bottom: 18px; }
  .poll-head .kicker { font-size: 15px; margin-bottom: 8px; }
  .poll h1 { font-size: 32px; }
  .ballot { gap: 8px; }
  .opt label { padding: 10px 12px; gap: 8px; }
  .opt .name { font-size: 17px; }
  .opt .desc { font-size: 13px; line-height: 1.35; margin-top: 4px; }
  .opt .box { font-size: 11px; letter-spacing: .12em; }
  .opt .box::before { width: 16px; height: 16px; }
  .poll-actions { margin-top: 18px; }
  .poll .btn { width: 100%; }
}
</style>
</head>
<body class="poll-page">

<div class="setup-note" id="setup-note" role="note">
  <div class="wrap"><strong>Setup needed:</strong> poll votes are not being saved yet. Add an endpoint URL to <code>MR_POLL_ENDPOINT</code> in <code>thank-you/index.html</code> (see README).</div>
</div>

<header class="masthead">
  <div class="wrap">
    <a class="logo" href="../" aria-label="Mountain Retro home">
      <img src="../assets/img/mountain-retro-lockup-light-transparent.svg" alt="Mountain Retro" width="236" height="55">
    </a>
  </div>
</header>

<main>
  <section class="poll" aria-labelledby="poll-title">
    <div class="wrap">
      <div class="poll-head">
        <p class="kicker">Confirmed. You're on our list! While you're here, we've got one question for you (totally optional)...</p>
        <h1 id="poll-title">What should we make next?</h1>
      </div>

      <form id="poll" novalidate>
        <fieldset class="ballot">
          <legend>What should Mountain Retro make next?</legend>
          <div class="opt">
            <input type="radio" name="choice" id="c-tee" value="ringer-tee">
            <label for="c-tee">
              <span><span class="name">Ringer tee</span><span class="desc">Contrast collar and cuffs. Soft, broken-in cotton.</span></span>
              <span class="box">Pick this</span>
            </label>
          </div>
          <div class="opt">
            <input type="radio" name="choice" id="c-shorts" value="retro-trail-shorts">
            <label for="c-shorts">
              <span><span class="name">Retro trail shorts</span><span class="desc">Short inseam, old-school cut. Made for the trail.</span></span>
              <span class="box">Pick this</span>
            </label>
          </div>
          <div class="opt">
            <input type="radio" name="choice" id="c-socks" value="more-sock-designs">
            <label for="c-socks">
              <span><span class="name">More sock designs</span><span class="desc">New stripes, new colors. More of the first thing.</span></span>
              <span class="box">Pick this</span>
            </label>
          </div>
          <div class="opt">
            <input type="radio" name="choice" id="c-cap" value="trailhead-cap">
            <label for="c-cap">
              <span><span class="name">Trailhead cap</span><span class="desc">Five panels, rope across the brim. Made for sun and switchbacks.</span></span>
              <span class="box">Pick this</span>
            </label>
          </div>
          <div class="opt">
            <input type="radio" name="choice" id="c-beanie" value="basecamp-beanie">
            <label for="c-beanie">
              <span><span class="name">Basecamp beanie</span><span class="desc">Ribbed knit, fold-up cuff, stripe to match the socks.</span></span>
              <span class="box">Pick this</span>
            </label>
          </div>
        </fieldset>

        <div class="poll-actions">
          <button class="btn" type="submit" id="vote-btn">Submit</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </section>

</main>

<script>
(function () {
  var ENDPOINT = (window.MR_POLL_ENDPOINT || '').trim();
  var KEY = 'mr_poll_vote_v2';
  var EMAIL_KEY = 'mr_email';
  var form = document.getElementById('poll');
  var btn = document.getElementById('vote-btn');
  var status = document.getElementById('status');
  var names = { 'ringer-tee': 'the ringer tee', 'retro-trail-shorts': 'retro trail shorts', 'more-sock-designs': 'more sock designs', 'trailhead-cap': 'the trailhead cap', 'basecamp-beanie': 'the basecamp beanie' };

  function store(get, val) {
    try { return get ? localStorage.getItem(KEY) : localStorage.setItem(KEY, val); } catch (e) { return null; }
  }
  // Who is voting: an email or Kit subscriber ID in the link (?email= / ?ck_subscriber_id=), else the
  // address the landing page saved when they signed up in this browser. Kit IDs are saved as "kit:<id>".
  var params = new URLSearchParams(location.search);
  var voter = (params.get('email') || '').trim();
  if (!voter) { try { voter = localStorage.getItem(EMAIL_KEY) || ''; } catch (e) {} }
  if (!voter && params.get('ck_subscriber_id')) voter = 'kit:' + params.get('ck_subscriber_id').trim();
  if (params.get('email')) { try { localStorage.setItem(EMAIL_KEY, voter); } catch (e) {} }
  function say(msg, cls) { status.textContent = msg; status.className = 'status' + (cls ? ' ' + cls : ''); }
  function lock(choice) {
    var el = form.querySelector('input[value="' + choice + '"]');
    if (el) el.checked = true;
    form.querySelectorAll('input').forEach(function (i) { i.disabled = true; });
    btn.disabled = true;
    btn.textContent = 'Submitted!';
  }

  if (!ENDPOINT) document.getElementById('setup-note').classList.add('show');

  // Already voted from this browser (only recorded after a confirmed save).
  var prior = store(true);
  if (prior && names[prior]) { lock(prior); say('You voted for ' + names[prior] + '. Thanks for weighing in.', 'ok'); }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var picked = form.querySelector('input[name="choice"]:checked');
    if (!picked) { say('Pick one first.'); return; }
    var choice = picked.value;

    if (!ENDPOINT) {
      say('Heads up: poll storage isn\'t connected yet, so this vote was not saved.', 'warn');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';
    say('');
    // text/plain keeps this a "simple" request (no CORS preflight), which Google Apps Script accepts.
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ choice: choice, email: voter, submitted_at: new Date().toISOString(), page: location.pathname })
    })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json().catch(function () { return {}; }); })
      .then(function (data) {
        if (data && data.ok === false) throw new Error('rejected');
        store(false, choice);
        lock(choice);
        setTimeout(function () { location.href = '../'; }, 1500);
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Submit';
        say('That didn\'t go through, so your vote wasn\'t saved. Try again in a minute.', 'warn');
      });
  });
})();
</script>
</body>
</html>
